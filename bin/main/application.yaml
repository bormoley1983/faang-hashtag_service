spring:
  application:
    name: hashtag-service

server:
  port: ${HASHTAG_SERVICE_PORT:8084}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: hashtag-service
      environment: ${METRICS_ENVIRONMENT:local}
      cluster: ${METRICS_CLUSTER:local}
